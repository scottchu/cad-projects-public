<div id="laifen-measurement-gate">
<style>#laifen-measurement-gate .section-drawing{display:block;width:100%}#laifen-measurement-gate .section-drawing text{fill:var(--foreground);font-size:12px}#laifen-measurement-gate .outline{fill:none;stroke:var(--foreground);stroke-width:1}#laifen-measurement-gate .device{fill:var(--viz-series-1);fill-opacity:.22;stroke:var(--viz-series-1)}#laifen-measurement-gate .pending{fill:none;stroke:var(--muted);stroke-dasharray:3 3}.readout{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;margin-block:.6rem}</style>
<p>尺寸待實測；此圖不代表已驗證配合。保留原寬偏好；實際列印內徑及配合仍未知。</p>
<div class="viz-controls"><label class="form-label">裝刷頭總長 L（mm）<input class="form-control" data-key="L" type="number" min="0" step="0.1" value="208"></label><label class="form-label">最大直徑 D（mm）<input class="form-control" data-key="D" type="number" min="0" step="0.1" value="29"></label><label class="form-label">總軸向餘量（mm）<input class="form-control" data-key="slack" type="number" min="0" step="0.1" value="5"></label></div>
<div class="viz-controls"><label class="form-label">位置 q：<span data-role="q-value">0.5</span><input class="form-range" data-key="q" aria-label="牙刷軸向位置 q" type="range" min="0" max="1" step="0.01" value="0.5"></label><button class="btn" type="button" data-preset="0.5">置中</button><button class="btn" type="button" data-preset="0">靠底</button></div>
<div class="readout"><span>固定下段參考內徑 30 mm</span><span>固定上段參考內徑 31 mm</span></div><p data-role="error" role="alert" class="text-destructive"></p><div aria-live="polite"><p data-role="state"></p><div data-role="gaps" class="readout"></div><p data-role="targets" class="text-destructive"></p><div data-role="dimensions" class="readout"></div></div><svg class="section-drawing" data-role="section" role="img" aria-label="同一比例的牙刷暫定包絡與階梯內腔示意"></svg><p>有效咬合 5–6 目標；尚未定案</p><p>z132–137 為待定接合帶，並非螺紋、接觸或已證實咬合。</p>
</div>
<script>
(()=>{'use strict';const root=document.getElementById('laifen-measurement-gate'),ui=Object.fromEntries(['section','error','state','gaps','targets','dimensions','q-value'].map(k=>[k,root.querySelector(`[data-role="${k}"]`)])),inputs=[...root.querySelectorAll('input[data-key]')],field=Object.fromEntries(inputs.map(i=>[i.dataset.key,i])),fixed=Object.freeze({wall:2.4,floor:3,lower:137,overlap:5,upperMouth:132,lowerID:30,upperID:31}),fmt=v=>Number(v.toFixed(3)).toString();
const near=(a,b,...operands)=>Math.abs(a-b)<=8*Number.EPSILON*Math.max(1,Math.abs(a),Math.abs(b),...operands.map(Math.abs));
function compute(p){
 if(!Object.values(p).every(Number.isFinite)||p.L<=0||p.D<=0||p.slack<0||p.q<0||p.q>1)return null;
 const C=p.L+p.slack,capDepth=C-132,lowerGap=(30-p.D)/2,upperGap=(31-p.D)/2,bottom=p.q*p.slack,top=(1-p.q)*p.slack,deviceTop=bottom+p.L,outerTop=C+3,closedLength=C+6;
 if(![C,capDepth,lowerGap,upperGap,bottom,top,deviceTop,outerTop,closedLength].every(Number.isFinite)||capDepth<=0||C<=137)return null;
 // Roundoff tolerance checks residuals; strict inequalities preserve real positive extents.
 if(!near(C-p.L,p.slack,C,p.L)||!near(deviceTop-bottom,p.L,deviceTop,bottom)||!near(C-deviceTop,top,C,deviceTop)||!near(closedLength-C,6,closedLength,C))return null;
 if((p.slack>0&&C<=p.L)||outerTop<=C||closedLength<=C||deviceTop<=bottom||p.D/2<=0)return null;
 if(p.slack>0&&((p.q>0&&bottom<=0)||(p.q<1&&top<=0)))return null;
 if((top>0&&deviceTop>=C)||(bottom>0&&deviceTop<=p.L))return null;
 return{...p,C,capDepth,lowerGap,upperGap,bottom,top,deviceTop,closedLength}
}
function render(d){const width=ui.section.getBoundingClientRect().width;if(!Number.isFinite(width)||width<=0)return false;const h=500,s=Math.min(380/d.closedLength,width*.35/35.8),cx=width*.38,z=m=>54+(d.C+3-m)*s,x=m=>cx+m*s,ll=x(-15),lr=x(15),ul=x(-15.5),ur=x(15.5),exterior=(offset=4)=>x(fixed.upperID/2+fixed.wall)+offset,stop=exterior(18),label=stop+12;const screen=[width,h,s,cx,ll,lr,ul,ur,x(-17.4),x(17.4),x(-17.9),x(17.9),x(-d.D/2),d.D*s,d.L*s,exterior(),stop,label,label-4,label+8,label+12,label+16,label+20,label+32,z(0),z(132),z(134.5),z(137),z(d.C),z(d.deviceTop),z(d.bottom+d.L/2),z(137)-27,z(132)+24,z(134.5)+60,z(0)-74,z(d.C)+16];if(!screen.every(Number.isFinite))return false;ui.section.setAttribute('viewBox',`0 0 ${width} ${h}`);ui.section.setAttribute('height',h);ui.section.innerHTML=`<title>牙刷包絡及閉合階梯內腔，單位 mm</title><g data-scale="${s}"><path class="outline" data-geometry="lower-bore" d="M ${ll} ${z(0)} V ${z(137)} H ${ul} M ${lr} ${z(0)} V ${z(137)} H ${ur}"/><path class="outline" data-geometry="upper-bore" d="M ${ul} ${z(137)} V ${z(d.C)} M ${ur} ${z(137)} V ${z(d.C)}"/><path class="outline" data-geometry="lower-floor-reference" d="M ${x(-17.4)} ${z(0)} H ${x(17.4)}"/><path class="outline" data-geometry="upper-floor-reference" d="M ${x(-17.9)} ${z(d.C)} H ${x(17.9)}"/><path class="pending" data-geometry="pending-joint-band" d="M ${ul-4} ${z(132)} H ${ur+4} M ${ul-4} ${z(137)} H ${ur+4}"/><rect class="device" data-geometry="device" x="${x(-d.D/2)}" y="${z(d.deviceTop)}" width="${d.D*s}" height="${d.L*s}"/><path class="outline" data-geometry="lower-id-span" d="M ${ll} 34 H ${lr}"/><text x="${cx}" y="22" text-anchor="middle">下段參考 ID 30</text><path class="outline" data-geometry="upper-id-span" d="M ${ul} 48 H ${ur}"/><text x="${cx}" y="64" text-anchor="middle">上段參考 ID 31</text><text x="${cx}" y="${z(d.bottom+d.L/2)}" text-anchor="middle">暫定包絡 L ${fmt(d.L)} / D ${fmt(d.D)}</text><path class="outline" data-geometry="neck-leader" d="M ${exterior()} ${z(137)} H ${label-4} V ${z(137)-24}"/><text data-joint-label="neck" x="${label}" y="${z(137)-27}">下段頸頂 z137</text><path class="outline" data-geometry="mouth-leader" d="M ${exterior()} ${z(132)} H ${label-4} V ${z(132)+12}"/><text data-joint-label="mouth" x="${label}" y="${z(132)+24}">外止擋／上蓋口 z132</text><path class="outline" data-geometry="band-leader" d="M ${exterior()} ${z(134.5)} H ${label+16} V ${z(134.5)+48}"/><text data-joint-label="band" x="${label+20}" y="${z(134.5)+60}">待定接合帶 5</text><g data-geometry="external-stop"><path class="outline" d="M ${stop} ${z(132)} H ${stop+8}"/></g><path class="outline" data-geometry="gravity" d="M ${label+20} ${z(0)-74} v 32 l -4 -6 m 4 6 l 4 -6"/><text x="${label+32}" y="${z(0)-54}">重力</text><text x="${label}" y="${z(d.C)+16}">上隙 ${fmt(d.top)}</text><text x="${label}" y="${z(0)-12}">下隙 ${fmt(d.bottom)}</text></g>`;return true;}
function update(){const p=Object.fromEntries(inputs.map(i=>[i.dataset.key,i.value.trim()===''?NaN:Number(i.value)])),d=compute(p);ui['q-value'].textContent=Number.isFinite(p.q)?fmt(p.q):'—';ui.error.textContent='';if(!d||!render(d)){ui.error.textContent='請輸入有限數值：L、D 須大於 0，軸向餘量不可為負，q 須在 0 至 1，且 C 須大於 137。';for(const k of ['section','state','gaps','targets','dimensions'])ui[k].innerHTML='';return}ui.state.textContent=d.slack===0?'兩端接觸；不代表固定':d.q===0?'由底面承托：底端接觸':d.q===1?'頂端接觸；不代表固定':'未固定：僅示意位置';ui.gaps.innerHTML=`<span>下段參考孔徑／暫定包絡：每側 ${fmt(d.lowerGap)} mm</span><span>上段參考孔徑／暫定包絡：每側 ${fmt(d.upperGap)} mm</span><span>上隙 ${fmt(d.top)} mm；下隙 ${fmt(d.bottom)} mm</span>`;ui.targets.textContent=[d.slack<3?'軸向餘量未達 3 mm 目標':'',d.lowerGap<=0?'下段參考孔徑與包絡接觸／干涉；不保證可插入':'',d.upperGap<=0?'上段參考孔徑與包絡接觸／干涉；不保證可插入':''].filter(Boolean).join('；');ui.dimensions.innerHTML=`<span>內腔 C ${fmt(d.C)} mm</span><span>上蓋內深 ${fmt(d.capDepth)} mm</span><span>閉合外端至外端參考 ${fmt(d.closedLength)} mm</span>`}inputs.forEach(i=>i.addEventListener('input',update));root.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{field.q.value=b.dataset.preset;update()}));new ResizeObserver(update).observe(ui.section);window.__laifenMeasurementGate=Object.freeze({compute,fixed});update()})();
</script>
