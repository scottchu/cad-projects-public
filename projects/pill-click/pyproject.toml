[project]
name = "pill-click"
version = "0.1.0"
description = "Parametric pill click model for 3D printing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.11.1",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "pytest>=9.1.1",
    "trimesh>=5.0.0",
]
