<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">P20 R1 fixed-rod reset analytic 2D gate</title>
  <desc id="desc">Front YZ intent diagram, centered-equivalent outer-plate motion about the new axle, and exact P19 axial stack showing unavoidable white-rod intersections with solid outer plates after all six outer rod rails are removed.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#15803d"/></marker>
    <pattern id="collision" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fee2e2"/><rect width="5" height="12" fill="#dc2626"/></pattern>
    <style>
      .title{font:700 30px ui-sans-serif,system-ui,sans-serif;fill:#111827}.h{font:700 21px ui-sans-serif,system-ui,sans-serif;fill:#111827}.t{font:16px ui-sans-serif,system-ui,sans-serif;fill:#1f2937}.s{font:14px ui-sans-serif,system-ui,sans-serif;fill:#374151}.tiny{font:12px ui-monospace,SFMono-Regular,monospace;fill:#374151}.axis{stroke:#64748b;stroke-width:2}.dim{stroke:#475569;stroke-width:1.5;stroke-dasharray:5 5}.plate{fill:#60a5fa;fill-opacity:.20;stroke:#1d4ed8;stroke-width:3}.innerrail{stroke:#d97706;stroke-width:16.6;stroke-linecap:round;opacity:.68}.rod{fill:#f8fafc;stroke:#dc2626;stroke-width:4}.axle{fill:#7c3aed;stroke:#4c1d95;stroke-width:3}.old{fill:none;stroke:#7c3aed;stroke-width:2;stroke-dasharray:7 6}.ok{fill:#dcfce7;stroke:#15803d;stroke-width:2}.bad{fill:#fef2f2;stroke:#dc2626;stroke-width:3}.ghost{fill:none;stroke-width:3;stroke-dasharray:9 7}.labelbox{fill:white;fill-opacity:.92;stroke:#cbd5e1;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="50" y="50" class="title">P20 R1 — fixed-rod reset: 2D intent / topology gate</text>
  <text x="50" y="80" class="t">FRONT is world YZ: +Y right, +Z up. P19 OPEN/END rod paths and the four-plate X stack stay frozen.</text>

  <!-- Main FRONT-YZ panel, scale 8 px/mm, origin C=(350,355). -->
  <rect x="40" y="105" width="720" height="590" rx="18" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <text x="65" y="140" class="h">A. FRONT-YZ at OPEN — requested topology</text>
  <line x1="90" y1="355" x2="700" y2="355" class="axis" marker-end="url(#arrow-blue)"/>
  <line x1="350" y1="650" x2="350" y2="175" class="axis" marker-end="url(#arrow-blue)"/>
  <text x="704" y="350" class="t">+Y</text><text x="357" y="178" class="t">+Z</text>
  <circle cx="350" cy="355" r="220" class="plate"/>
  <text x="78" y="184" class="s">Outer plate body, OD54.7/55.0</text>
  <text x="78" y="203" class="s">all 3 outer rod rails removed on each side (0/6 remain)</text>

  <!-- Retained fixed-inner tracks, 4.15 mm shown at 4 px/mm for legibility. -->
  <line x1="390" y1="275" x2="426.42" y2="290.82" class="innerrail"/>
  <line x1="513.2" y1="275" x2="476.42" y2="336.82" class="innerrail"/>
  <line x1="513.2" y1="428.38" x2="526.42" y2="382.82" class="innerrail"/>
  <text x="480" y="505" class="s" fill="#92400e">amber = 3 retained inner-plate paths</text>

  <!-- C and axle datums. -->
  <circle cx="350" cy="355" r="6" fill="#111827"/>
  <text x="360" y="374" class="t">C = (0, 0), old plate center at OPEN</text>
  <circle cx="246" cy="427" r="8" class="old"/>
  <text x="105" y="415" class="s">old A = (-13, -9)</text>
  <line x1="246" y1="427" x2="230" y2="443" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-green)"/>
  <circle cx="230" cy="443" r="31.6" class="axle"/>
  <circle cx="230" cy="443" r="5" fill="white"/>
  <text x="72" y="466" class="t">new A = (-15, -11)</text>
  <text x="72" y="487" class="s">constant OD7.90 round guide at A</text>

  <!-- OPEN rod centers, OD4. -->
  <circle cx="390" cy="275" r="16" class="rod"/>
  <circle cx="513.2" cy="275" r="16" class="rod"/>
  <circle cx="513.2" cy="428.38" r="16" class="rod"/>
  <text x="402" y="251" class="s">bottom rod</text>
  <text x="527" y="251" class="s">diagonal rod</text>
  <text x="532" y="436" class="s">upright rod</text>
  <rect x="65" y="535" width="665" height="125" rx="12" class="bad"/>
  <text x="88" y="568" class="h" fill="#b91c1c">BLOCKER AT OPEN</text>
  <text x="88" y="598" class="t">Each OD4×50 rod crosses both 3.20 mm outer-plate X slabs.</text>
  <text x="88" y="625" class="t">With no outer rod rail/hole, all 6 rod↔outer-plate pairs are full-section collisions.</text>
  <text x="88" y="649" class="tiny">40.212 mm³ per pair; 241.274 mm³ total at OPEN (analytic full-cylinder overlap)</text>

  <!-- Centered-equivalent motion panel. -->
  <rect x="790" y="105" width="770" height="385" rx="18" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <text x="815" y="140" class="h">B. Centered-equivalent outer-plate frame about new A</text>
  <text x="815" y="168" class="t">Frame origin = A; local guide center qA(u) = (0,0) for both sides and every state.</text>
  <!-- motion inset scale 7 px/mm, A=(1040,325) -->
  <circle cx="1040" cy="325" r="130.21" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 6"/>
  <circle cx="1040" cy="325" r="28" class="axle"/><circle cx="1040" cy="325" r="5" fill="white"/>
  <text x="950" y="365" class="s">fixed A / identical round guide</text>
  <circle cx="1145" cy="248" r="6" fill="#111827"/>
  <text x="1160" y="245" class="s">OPEN C</text>
  <path d="M1145 248 A130.21 130.21 0 0 1 1123.69 371.05" fill="none" stroke="#15803d" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M1145 248 A130.21 130.21 0 0 0 954.80 273.30" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <circle cx="1166.47" cy="294.04" r="5" fill="#15803d"/><circle cx="1123.69" cy="371.05" r="7" fill="#15803d"/>
  <circle cx="1107.54" cy="213.68" r="5" fill="#2563eb"/><circle cx="954.80" cy="273.30" r="7" fill="#2563eb"/>
  <text x="1160" y="317" class="s" fill="#166534">L mid -22.5°</text><text x="1135" y="394" class="s" fill="#166534">L END -45°</text>
  <text x="1086" y="199" class="s" fill="#1d4ed8">R mid +22.5°</text><text x="820" y="268" class="s" fill="#1d4ed8">R END +45°</text>
  <rect x="1285" y="205" width="240" height="220" rx="12" class="ok"/>
  <text x="1300" y="238" class="h" fill="#166534">Math gate: PASS</text>
  <text x="1300" y="270" class="tiny">T_s(q,u)=A+R(alpha_s)q</text>
  <text x="1300" y="298" class="tiny">q_s=R(-alpha_s)(x-A)</text>
  <text x="1300" y="326" class="tiny">q_s(A,u)=0</text>
  <text x="1300" y="354" class="tiny">T_s(0,u)=A</text>
  <text x="1300" y="386" class="s">alphaL=-45u</text>
  <text x="1300" y="411" class="s">alphaR=+45u; relative=90°</text>

  <!-- Axial stack panel. -->
  <rect x="790" y="515" width="770" height="370" rx="18" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <text x="815" y="550" class="h">C. Exact P19 axial stack (X), frozen in P20</text>
  <text x="815" y="577" class="s">One representative OD4 rod; the same unavoidable crossing occurs for bottom, diagonal and upright.</text>
  <!-- x scale 12 px/mm; x=0 at 1175 -->
  <line x1="850" y1="705" x2="1500" y2="705" class="axis" marker-end="url(#arrow-blue)"/>
  <text x="1505" y="700" class="t">+X</text>
  <rect x="875" y="666" width="600" height="24" rx="12" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="1090" y="657" class="s">OD4 rod X=[-25,+25]</text>
  <rect x="870.8" y="640" width="108.6" height="76" rx="9" fill="#111827" opacity=".88"/>
  <rect x="1370.4" y="640" width="108.6" height="76" rx="9" fill="#111827" opacity=".88"/>
  <text x="884" y="735" class="tiny">left cap</text><text x="1390" y="735" class="tiny">right cap</text>
  <rect x="1022.2" y="615" width="38.4" height="126" fill="url(#collision)" stroke="#991b1b" stroke-width="2"/>
  <rect x="1289.4" y="615" width="38.4" height="126" fill="url(#collision)" stroke="#991b1b" stroke-width="2"/>
  <rect x="1065.4" y="625" width="38.4" height="106" fill="#f59e0b" fill-opacity=".60" stroke="#b45309" stroke-width="2"/>
  <rect x="1246.2" y="625" width="38.4" height="106" fill="#f59e0b" fill-opacity=".60" stroke="#b45309" stroke-width="2"/>
  <rect x="1104" y="650" width="142.2" height="56" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="1118" y="682" class="s">18.40 mm clear span</text>
  <text x="991" y="605" class="tiny">outer [-16.0,-12.8]</text>
  <text x="1260" y="605" class="tiny">outer [12.8,16.0]</text>
  <text x="1048" y="763" class="tiny">inner [-12.4,-9.2]</text>
  <text x="1218" y="763" class="tiny">inner [9.2,12.4]</text>
  <line x1="1060.6" y1="780" x2="1065.4" y2="780" stroke="#475569" stroke-width="4"/>
  <line x1="1284.6" y1="780" x2="1289.4" y2="780" stroke="#475569" stroke-width="4"/>
  <text x="1080" y="785" class="tiny">0.40 mm running gaps (each side)</text>
  <rect x="830" y="800" width="700" height="58" rx="10" class="bad"/>
  <text x="850" y="825" class="t">Red hatch = solid outer-plate slabs demanded by “remove all outer rails”.</text>
  <text x="850" y="848" class="t">The uncut rod occupies those same X intervals; a FRONT-YZ relocation cannot fix this axial overlap.</text>

  <rect x="40" y="915" width="1520" height="55" rx="12" fill="#7f1d1d"/>
  <text x="70" y="950" style="font:700 21px ui-sans-serif,system-ui,sans-serif;fill:white">Disposition: BLOCKED before BREP/STEP — centered-equivalent math passes, but the frozen rod/stack topology collides at OPEN.</text>
</svg>
