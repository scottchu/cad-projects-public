[project]
name = "xt60-bend-jig"
version = "0.1.0"
description = "Parametric XT60 pigtail bend and cooling jig"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d>=0.11.1",
    "cadgen==0.4.15",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
