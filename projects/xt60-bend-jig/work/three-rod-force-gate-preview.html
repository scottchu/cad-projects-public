  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

    height: 44px;
  }

    height: 44px;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;xt60-force-gate&#x27;);
      const slider = root.querySelector(&#x27;#xt60-force-progress&#x27;);
      const percent = root.querySelector(&#x27;#xt60-force-percent&#x27;);
      const state = root.querySelector(&#x27;#xt60-force-state&#x27;);
      const lock = root.querySelector(&#x27;#xt60-passive-lock&#x27;);
      const rods = {
        blue: { element: root.querySelector(&#x27;#xt60-blue-rod&#x27;), open: [126, 102], end: [500, 158] },
        orange: { element: root.querySelector(&#x27;#xt60-orange-rod&#x27;), open: [126, 215], end: [500, 215] },
        green: { element: root.querySelector(&#x27;#xt60-green-rod&#x27;), open: [126, 328], end: [500, 272] }
      };

      const update = () =&gt; {
        const t = Number(slider.value) / 100;
        Object.values(rods).forEach((rod) =&gt; {
          const x = rod.open[0] + (rod.end[0] - rod.open[0]) * t;
          const y = rod.open[1] + (rod.end[1] - rod.open[1]) * t;
          rod.element.setAttribute(&#x27;transform&#x27;, `translate(${x} ${y})`);
        });
        lock.setAttribute(&#x27;opacity&#x27;, String(Math.max(0, (t - 0.84) / 0.16)));
        percent.textContent = `${Math.round(t * 100)}%`;

          ? &#x27;開啟&#x27;
          : t === 1
            ? &#x27;鎖定 — 被動鎖具固定手動移到位的三支桿&#x27;
            : &#x27;移動中 — 兩指拉、一指推；三支桿全部移動&#x27;;
      };

      slider.addEventListener(&#x27;input&#x27;, update);
      root.querySelector(&#x27;#xt60-force-pass&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; {
        if (window.openai?.sendFollowUpMessage) {
          await window.openai.sendFollowUpMessage({
            title: &#x27;確認三支桿動作&#x27;,
            prompt: &#x27;PASS。這是正確的 XT60 jig 操作：每側兩隻手指拉動外側兩支桿，一隻手指推動中心桿；三支桿沿各自 inner rail 移動，獨立的被動鎖具只負責固定最終位置。請進入下一個 CAD 設計 gate。&#x27;
          });
        }
      });
      root.querySelector(&#x27;#xt60-force-fail&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; {
        if (window.openai?.sendFollowUpMessage) {
          await window.openai.sendFollowUpMessage({
            title: &#x27;修正受力關係&#x27;,
            prompt: &#x27;FAIL。圖中的三支桿受力關係仍然不對。建立 CAD 前，請再讓我指出哪支桿被推、哪兩支桿被拉，以及被動鎖具應該接觸哪裡。&#x27;
          });
        }
      });
      update();
    })();
  &lt;/script&gt;
